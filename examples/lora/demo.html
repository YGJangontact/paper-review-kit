<section id="demo"><h2>수식 실험: 업데이트 강도 바꾸기</h2><p>설명용 고정 A·B·x. alpha를 바꾸면 출력이 어떻게 달라질까요?</p><label for="alpha">alpha: <output id="av">1</output></label><br><input id="alpha" type="range" min="0" max="2" step="0.1" value="1"><p id="result" aria-live="polite"></p><svg viewBox="0 0 600 220" role="img" aria-label="입력과 출력의 각 성분을 비교하는 막대. 가로축 원점 300, 값 하나당 60픽셀"><line x1="300" y1="10" x2="300" y2="200" stroke="#999"/><text x="15" y="60">h[0]</text><text x="15" y="140">h[1]</text><rect id="b0" y="35" height="40" fill="#285e89"/><rect id="b1" y="115" height="40" fill="#9c632d"/><text x="290" y="215">0</text></svg><p><small>막대: 출력 성분, 값 단위 없음. 성능 곡선이나 학습 과정이 아닙니다.</small></p><label for="rank">1024×1024 한 층의 rank: <output id="rv">4</output></label><br><input id="rank" type="range" min="1" max="64" value="4"><p id="params" aria-live="polite"></p><p>기반 가중치·활성값·optimizer를 포함한 전체 메모리 계산은 아닙니다.</p></section><script>
function update(){let a=+document.querySelector('#alpha').value;document.querySelector('#av').textContent=a;let h=[2-2*a,3-a];document.querySelector('#result').textContent='h = ['+h.map(x=>x.toFixed(1)).join(', ')+']';h.forEach((v,i)=>{let e=document.querySelector('#b'+i);e.setAttribute('x',Math.min(300,300+v*60));e.setAttribute('width',Math.abs(v*60))});let r=+document.querySelector('#rank').value;document.querySelector('#rv').textContent=r;document.querySelector('#params').textContent='학습할 숫자 '+(2048*r).toLocaleString()+' / 1,048,576 ('+(r/512*100).toFixed(2)+'%)';}document.querySelector('#alpha').addEventListener('input',update);document.querySelector('#rank').addEventListener('input',update);update();</script>
